name: build-gpu-image

# Builds the rl-rewardhacking GPU image on a GitHub-hosted linux/amd64 runner and pushes
# it to ghcr.io. Manual trigger only — this pushes ~12 GB and takes a while.
#
# Native amd64, no QEMU: the venv it builds is linux x86_64 wheels, and emulating that
# would either fail or take hours.
#
# No secrets. The venv is built from uv.lock inside the image, so there is nothing to
# download from a private repo; pushing uses the ephemeral GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      rh_commit:
        description: rl-rewardhacking commit to bake
        required: true
        default: 73695ff
      base_image:
        description: Base image
        required: true
        default: nielsrolf/ow-vllm:v0.11

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `/` on a hosted runner has well under half of what this build needs. The runner's
      # second volume at /mnt has ~65 GB free, so docker gets moved there rather than
      # trying to squeeze the build onto the OS disk. Peak usage is roughly: base image
      # 14 GB extracted + 7 GB of blobs, our venv layer 14 GB + ~6 GB compressed, and a
      # ~7 GB uv cache that the Dockerfile deletes before the layer closes, so ~50 GB.
      - name: Move docker to /mnt
        run: |
          df -h / /mnt
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker.socket docker
          docker info --format 'data-root: {{.DockerRootDir}}'

      # /mnt holds the build, but the checkout, /tmp and the buildkit client still live on
      # /. Only the large, fast wins — the apt purges cost minutes and buy little once
      # docker is off this volume.
      - name: Free space on /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY"
          df -h /

      # Fail here with a number rather than 40 minutes in with "no space left on device".
      - name: Check disk budget
        run: |
          root=$(docker info --format '{{.DockerRootDir}}')
          avail_gb=$(df -BG --output=avail "$root" | tail -1 | tr -dc '0-9')
          need_gb=50
          echo "docker root: ${root} | available: ${avail_gb} GB | budget: ${need_gb} GB"
          {
            echo "### Disk budget"
            echo "| docker root | available | needed |"
            echo "|---|---|---|"
            echo "| ${root} | ${avail_gb} GB | ${need_gb} GB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$avail_gb" -lt "$need_gb" ]; then
            echo "::error::Only ${avail_gb} GB free on ${root}, need ~${need_gb} GB. Build on a rented amd64 VM with 100 GB instead."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Tagged by what it pins, never `latest`: the whole point of baking the image is
      # that a run can say which environment produced it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            RH_COMMIT=${{ inputs.rh_commit }}
          tags: ghcr.io/${{ github.repository_owner }}/rl-rewardhacking-gpu:${{ inputs.rh_commit }}

      # The numbers this run actually used, so the budget above can be tuned from evidence
      # rather than from the estimate in the comment.
      - name: Report disk used
        if: always()
        run: df -h / /mnt
