name: build-gpu-image

# Builds the rl-rewardhacking GPU image on a GitHub-hosted linux/amd64 runner and pushes
# it to ghcr.io. Manual trigger only — this pushes ~12 GB and takes a while.
#
# Native amd64, no QEMU: the venv it builds is linux x86_64 wheels, and emulating that
# would either fail or take hours.
#
# No secrets. The venv is built from uv.lock inside the image, so there is nothing to
# download from a private repo; pushing uses the ephemeral GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      rh_commit:
        description: rl-rewardhacking commit to bake
        required: true
        default: 73695ff
      base_image:
        description: Base image
        required: true
        default: nielsrolf/ow-vllm:v0.11

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Peak disk is roughly: base image ~14 GB extracted plus ~7 GB of blobs, our venv
      # layer ~14 GB plus ~6 GB compressed at export, and a ~7 GB uv cache the Dockerfile
      # deletes before the layer closes — call it ~45 GB.
      #
      # Docker stays on `/` and the space is taken off the preinstalled toolchains. The
      # first attempt moved the data-root to /mnt on the assumption it had ~65 GB free; it
      # measured 37 GB, which is not enough either. `/` is ~75 GB with ~29 GB free, and the
      # toolchains below are ~30 GB of it — Android SDK and hostedtoolcache alone are ~20 GB.
      # Nothing later in this workflow uses them: there is no setup-python step, and the
      # actions run on the runner's own bundled node.
      - name: Free space on /
        run: |
          df -h / /mnt
          before=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          sudo rm -rf /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /usr/share/dotnet \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/google-cloud-sdk \
                      /usr/local/graalvm /usr/local/julia* || true
          docker image prune -af
          after=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "reclaimed $((after - before)) GB on / (${before} -> ${after})"
          df -h /

      # Fail here with a number rather than 40 minutes in with "no space left on device".
      # If this ever fails again, the next lever is spanning / and /mnt with an LVM volume
      # group over two loop files, which would give ~66 GB; it is not worth the moving parts
      # until a cleaned `/` is shown to be too small.
      - name: Check disk budget
        run: |
          root=$(docker info --format '{{.DockerRootDir}}')
          avail_gb=$(df -BG --output=avail "$root" | tail -1 | tr -dc '0-9')
          need_gb=45
          tight_gb=55
          echo "docker root: ${root} | available: ${avail_gb} GB | budget: ${need_gb} GB"
          {
            echo "### Disk budget"
            echo "| docker root | available | needed |"
            echo "|---|---|---|"
            echo "| ${root} | ${avail_gb} GB | ${need_gb} GB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$avail_gb" -lt "$need_gb" ]; then
            echo "::error::Only ${avail_gb} GB free on ${root}, need ~${need_gb} GB. Next lever is an LVM volume group spanning / and /mnt; failing that, a rented amd64 VM with 100 GB."
            exit 1
          fi
          if [ "$avail_gb" -lt "$tight_gb" ]; then
            echo "::warning::${avail_gb} GB free against a ~${need_gb} GB estimate — little margin, so an ENOSPC later in this run is the estimate being wrong, not the gate."
          fi

      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # The rh_commit tag alone does not identify the image: it names the env repo's commit,
      # so any change to this Dockerfile produces different bits under the same tag. The
      # second tag below pins both halves, and a run that wants to say what built it should
      # record that one.
      - name: Short sha of this repo
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Tagged by what it pins, never `latest`: the whole point of baking the image is
      # that a run can say which environment produced it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=${{ inputs.base_image }}
            RH_COMMIT=${{ inputs.rh_commit }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rl-rewardhacking-gpu:${{ inputs.rh_commit }}
            ghcr.io/${{ github.repository_owner }}/rl-rewardhacking-gpu:${{ inputs.rh_commit }}-${{ steps.sha.outputs.short }}

      # The numbers this run actually used, so the budget above can be tuned from evidence
      # rather than from the estimate in the comment.
      - name: Report disk used
        if: always()
        run: df -h / /mnt
